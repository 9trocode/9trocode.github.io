title: Alex Idowu
description: >-
  Field notes for systems nerds: platforms, isolation, sandboxes, and
  production. Writing by Alex Idowu in Lagos.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

author:
  name: Alex Idowu
  email: alexidowu25@gmail.com
  twitter: nitrocode

url: "https://nitrocode.sh"
baseurl: ""

# SEO
lang: en-US
tagline: Build · Operate · Ship
logo: /assets/images/nitrocode-og-v2.png

twitter:
  username: nitrocode
  card: summary_large_image

social:
  name: Alex Idowu
  links:
    - https://twitter.com/nitrocode
    - https://github.com/9trocode
    - https://linkedin.com/in/nitrocode

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title

# Publish posts even if front-matter date is slightly ahead of build clock
future: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

show_downloads: false

github:
  repository_url: https://github.com/9trocode/9trocode.github.io

# Analytics
# Sign up for Google Analytics 4 at https://analytics.google.com
# Replace with your GA4 Measurement ID (format: G-XXXXXXXXXX)
google_analytics:
