<!-- OpenGraph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
{% assign og_image_path = page.image | default: '/assets/images/nitrocode-og-v2.png' %}
<meta property="og:image" content="{{ site.url }}{{ og_image_path }}?v=20260811b">
<meta property="og:image:secure_url" content="{{ site.url }}{{ og_image_path }}?v=20260811b">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ page.title | default: site.title }}">
<meta property="og:site_name" content="Alex Idowu">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@nitrocode">
<meta name="twitter:creator" content="@nitrocode">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ og_image_path }}?v=20260811b">
<meta name="twitter:image:alt" content="{{ page.title | default: site.title }}">

<!-- Favicons (AI monogram, matches nitrocode-og-v2 brand) -->
<link rel="icon" type="image/svg+xml" href="{{ site.url }}/assets/images/favicon.svg?v=20260811">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.url }}/assets/images/favicon-32x32.png?v=20260811">
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.url }}/assets/images/favicon-16x16.png?v=20260811">
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.url }}/assets/images/apple-touch-icon.png?v=20260811">
<meta name="theme-color" content="#0c0b0a">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<!-- Additional Meta Tags -->
<meta name="author" content="Alex Idowu">
<meta name="keywords" content="Alex Idowu, nitrocode, PipeOps, platform engineering, cloud-native security, Kubernetes, Terraform, BuildKit, multi-tenancy, Rexec, DevOps, Go, AWS, GCP, Azure">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<!-- Umami Analytics -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="94918036-99b3-452b-89cc-76aa286b7460"></script>
