<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nitrocode-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "light" ? "#f5f5f7" : "#000000");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
    {% seo %}
  </head>
  <body>
    <div class="site-shell">
      {% include nav.html %}
      <main class="site-main" id="main_content">
        <div class="wrap{% if page.wide %} wrap--wide{% endif %}">
          {{ content }}
        </div>
      </main>
      {% include footer.html %}
    </div>
    <script src="{{ '/assets/js/theme.js?v=' | append: site.github.build_revision | relative_url }}" defer></script>
  </body>
</html>
