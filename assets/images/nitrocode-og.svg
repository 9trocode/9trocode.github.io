<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Alex Idowu, nitrocode.sh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0b0a"/>
      <stop offset="55%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b3d" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e8ff47" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#e8ff47" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ff6b3d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0c0b0a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mark { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px; letter-spacing: 0.22em; fill: #ff6b3d; font-weight: 500; }
      .name { font-family: 'Times New Roman', Times, Georgia, serif; font-size: 92px; fill: #ebe6da; letter-spacing: -0.03em; }
      .tag { font-family: 'Times New Roman', Times, Georgia, serif; font-size: 34px; fill: #b7b0a1; letter-spacing: -0.02em; font-style: italic; }
      .meta { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px; letter-spacing: 0.12em; fill: #7d776c; }
      .url { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 22px; letter-spacing: 0.08em; fill: #ebe6da; }
      .chip { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; letter-spacing: 0.1em; fill: #b7b0a1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#ember)" opacity="0.35"/>

  <!-- Subtle grid -->
  <g stroke="#ebe6da" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#e8ff47"/>

  <!-- Frame -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#ebe6da" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top mark -->
  <text x="88" y="118" class="mark">NITROCODE.SH</text>

  <!-- Main identity -->
  <text x="88" y="280" class="name">Alex Idowu</text>
  <text x="88" y="345" class="tag">Platform engineering · cloud-native security</text>

  <!-- Chips -->
  <g transform="translate(88, 400)">
    <rect x="0" y="0" width="118" height="36" rx="2" fill="none" stroke="#ebe6da" stroke-opacity="0.18"/>
    <text x="16" y="23" class="chip">PIPEOPS</text>
    <rect x="130" y="0" width="100" height="36" rx="2" fill="none" stroke="#ebe6da" stroke-opacity="0.18"/>
    <text x="146" y="23" class="chip">IGRIS</text>
    <rect x="242" y="0" width="100" height="36" rx="2" fill="none" stroke="#ebe6da" stroke-opacity="0.18"/>
    <text x="258" y="23" class="chip">REXEC</text>
    <rect x="354" y="0" width="90" height="36" rx="2" fill="none" stroke="#ebe6da" stroke-opacity="0.18"/>
    <text x="370" y="23" class="chip">AEON</text>
  </g>

  <!-- Bottom meta -->
  <text x="88" y="520" class="meta">FOUNDER &amp; CTO · LAGOS</text>
  <text x="88" y="558" class="url">nitrocode.sh</text>

  <!-- Decorative monogram block (right) -->
  <g transform="translate(820, 160)">
    <circle cx="140" cy="140" r="128" fill="none" stroke="#ff6b3d" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="140" cy="140" r="96" fill="none" stroke="#e8ff47" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="140" cy="140" r="64" fill="#1a1410" stroke="#ebe6da" stroke-opacity="0.15" stroke-width="1"/>
    <text x="140" y="152" text-anchor="middle" font-family="Times New Roman, Times, Georgia, serif" font-size="72" fill="#ebe6da" letter-spacing="-0.04em">AI</text>
  </g>
</svg>
