<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" fill="none" role="img" aria-labelledby="dfTitle dfDesc">
  <title id="dfTitle">Rexec request dataflow</title>
  <desc id="dfDesc">When you create a sandbox or run a command, the request hits the Rexec API, is persisted in PostgreSQL, then either the Container Manager talks to Docker or the Agent Handler relays over outbound WebSocket to a BYOS agent. Output streams back to the UI.</desc>
  <defs>
    <marker id="dfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00A878"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="20" y="150" width="130" height="70" rx="10" stroke="#00A878" stroke-width="1.5" fill="rgba(0,168,120,0.08)"/>
  <text x="85" y="178" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Input</text>
  <text x="85" y="198" text-anchor="middle" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="10">create / exec</text>

  <line x1="150" y1="185" x2="200" y2="185" stroke="#00A878" stroke-width="1.5" marker-end="url(#dfArrow)"/>

  <!-- API -->
  <rect x="205" y="140" width="150" height="90" rx="10" stroke="#00A878" stroke-width="1.75" fill="rgba(0,168,120,0.12)"/>
  <text x="280" y="175" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Rexec API</text>
  <text x="280" y="195" text-anchor="middle" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="10">auth · route · policy</text>
  <text x="280" y="212" text-anchor="middle" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="10">WebSocket session</text>

  <!-- to DB -->
  <line x1="280" y1="140" x2="280" y2="88" stroke="#00A878" stroke-width="1.5" marker-end="url(#dfArrow)"/>
  <rect x="215" y="28" width="130" height="55" rx="10" stroke="#94A3B8" stroke-width="1.25" fill="rgba(148,163,184,0.12)"/>
  <text x="280" y="52" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="600">PostgreSQL</text>
  <text x="280" y="70" text-anchor="middle" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="10">persist session</text>

  <!-- branch -->
  <line x1="355" y1="185" x2="410" y2="185" stroke="#00A878" stroke-width="1.5"/>
  <line x1="410" y1="185" x2="410" y2="100" stroke="#00A878" stroke-width="1.5"/>
  <line x1="410" y1="185" x2="410" y2="270" stroke="#00A878" stroke-width="1.5"/>
  <line x1="410" y1="100" x2="455" y2="100" stroke="#00A878" stroke-width="1.5" marker-end="url(#dfArrow)"/>
  <line x1="410" y1="270" x2="455" y2="270" stroke="#00A878" stroke-width="1.5" marker-end="url(#dfArrow)"/>

  <!-- Cloud path -->
  <rect x="460" y="68" width="200" height="64" rx="10" stroke="#00A878" stroke-width="1.35" fill="rgba(0,168,120,0.08)"/>
  <text x="560" y="95" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Container Manager</text>
  <text x="560" y="114" text-anchor="middle" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="10">→ Docker Engine sandbox</text>

  <!-- BYOS path -->
  <rect x="460" y="238" width="200" height="64" rx="10" stroke="#00A878" stroke-width="1.35" fill="rgba(0,168,120,0.08)"/>
  <text x="560" y="265" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Agent Handler</text>
  <text x="560" y="284" text-anchor="middle" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="10">→ BYOS outbound WS</text>

  <!-- Output back -->
  <line x1="660" y1="100" x2="720" y2="100" stroke="#00A878" stroke-width="1.25"/>
  <line x1="660" y1="270" x2="720" y2="270" stroke="#00A878" stroke-width="1.25"/>
  <line x1="720" y1="100" x2="720" y2="270" stroke="#00A878" stroke-width="1.25"/>
  <line x1="720" y1="185" x2="780" y2="185" stroke="#00A878" stroke-width="1.5" marker-end="url(#dfArrow)"/>

  <rect x="785" y="150" width="150" height="70" rx="10" stroke="#00A878" stroke-width="1.5" fill="rgba(0,168,120,0.08)"/>
  <text x="860" y="178" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Output</text>
  <text x="860" y="198" text-anchor="middle" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="10">stream → UI / agent</text>

  <text x="480" y="360" fill="#6B7C8F" font-family="ui-monospace,monospace" font-size="11">One request in. Routed. Persisted. Executed. Streamed back.</text>
</svg>
