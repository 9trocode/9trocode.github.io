# Prefer Markdown when the client asks for it (AI agents).
# HTML remains the default for browsers and anything without text/markdown.
map $http_accept $preferred_ext {
    default                 "";
    "~*text/markdown"       ".md";
}

map $http_accept $index_file {
    default                 "index.html";
    "~*text/markdown"       "index.md";
}

server {
    listen       LISTEN_PORT;
    listen       [::]:LISTEN_PORT;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Register text/markdown so try_files-served .md files get the right type.
    # (A nested location ~ \.md$ does not re-match after try_files in location /.)
    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    charset utf-8;

    # Caches (and CF) must key on Accept when we negotiate.
    add_header Vary Accept always;

    # Root is special: $uri$preferred_ext becomes "/.md" which never exists.
    location = / {
        try_files /$index_file =404;
    }

    location / {
        # Markdown first when requested: sibling .md, then directory index.md,
        # then the normal HTML try_files chain.
        try_files $uri$preferred_ext $uri/index$preferred_ext $uri $uri/ $uri.html $uri/index.html =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/css text/markdown application/javascript application/json image/svg+xml;
}
